<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>هوش مصنوعی آریاز v5</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    .ai-layout{display:grid;grid-template-columns:280px 1fr;gap:18px;min-height:70vh}
    @media(max-width:900px){.ai-layout{grid-template-columns:1fr}}
    .ai-sidebar{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:16px;max-height:80vh;overflow-y:auto}
    .ai-main{background:#fff;border-radius:14px;border:1px solid #e2e8f0;display:flex;flex-direction:column;min-height:560px}
    .agent-item{display:block;width:100%;text-align:right;padding:12px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:8px;background:#f8fafc;cursor:pointer;font-family:inherit}
    .agent-item:hover,.agent-item.active{border-color:#2563eb;background:#eff6ff}
    .agent-item h4{font-size:.95rem;margin-bottom:4px}.agent-item p{font-size:.78rem;color:#64748b;margin:0}
    .chat-header{padding:16px 18px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .chat-body{flex:1;padding:18px;overflow-y:auto;max-height:440px;background:#f8fafc}
    .chat-footer{padding:14px;border-top:1px solid #e2e8f0;display:flex;gap:8px;flex-wrap:wrap}
    .chat-footer textarea{flex:1;min-width:200px;min-height:52px;padding:12px;border-radius:12px;border:1px solid #e2e8f0;font-family:inherit}
    .msg{margin-bottom:12px;max-width:92%}.msg.user{margin-right:auto}.msg.agent{margin-left:auto}
    .msg-bubble{padding:12px 14px;border-radius:14px;font-size:.92rem;line-height:1.75;white-space:pre-wrap}
    .msg.user .msg-bubble{background:#dbeafe}.msg.agent .msg-bubble{background:#fff;border:1px solid #e2e8f0}
    .empty-chat{text-align:center;padding:40px 16px;color:#64748b}
    .quick-prompts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
    .quick-prompts button{font-size:.78rem;padding:7px 11px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-family:inherit}
    .tabs-ai{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span>آ</span> آریاز</a>
      <nav class="nav" id="nav">
        <a href="agents.html" class="nav-cta">🤖 هوش مصنوعی</a>
        <a href="dashboard.html">داشبورد</a>
      </nav>
      <button class="menu-btn" id="menuBtn">☰</button>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <h1>🤖 موتور AI آریاز v5</h1>
      <p class="muted mb-6">تشخیص موضوع + پاسخ اجرایی تخصصی</p>
      <span class="badge" id="planBadge">AI v5</span>
      <div class="tabs-ai" style="margin-top:12px">
        <button type="button" class="tab active" id="tabChat" onclick="showTab('chat')">گفتگو</button>
        <button type="button" class="tab" id="tabHistory" onclick="showTab('history')">تاریخچه</button>
        <button type="button" class="tab" id="tabOutputs" onclick="showTab('outputs')">خروجی‌ها</button>
      </div>
      <div id="panelChat">
        <div class="ai-layout">
          <aside class="ai-sidebar"><div id="agentList"></div></aside>
          <section class="ai-main">
            <div class="chat-header">
              <div><strong id="activeAgentTitle">انتخاب Agent</strong><p class="muted" id="activeAgentDesc" style="margin:0;font-size:.85rem">—</p></div>
              <div><button type="button" class="btn btn-secondary btn-sm" onclick="clearCurrentChat()">پاک کردن</button> <button type="button" class="btn btn-secondary btn-sm" onclick="saveLastOutput()">ذخیره</button></div>
            </div>
            <div class="chat-body" id="chatBody"><div class="empty-chat"><p>Agent را انتخاب کنید</p><div class="quick-prompts" id="quickPrompts"></div></div></div>
            <div class="chat-footer"><textarea id="chatInput" rows="2" placeholder="سوال تخصصی بنویسید..."></textarea><button type="button" class="btn btn-primary" onclick="sendMessage()">ارسال</button></div>
          </section>
        </div>
      </div>
      <div id="panelHistory" class="hidden"><div class="card" style="padding:20px"><div id="historyList"></div></div></div>
      <div id="panelOutputs" class="hidden"><div class="card" style="padding:20px"><div id="outputsList"></div></div></div>
    </div>
  </main>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/agents.js?v=5"></script>
</body>
</html>
