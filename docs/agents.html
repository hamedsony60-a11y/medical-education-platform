<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>هوش مصنوعی آریاز</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    .ai-layout{display:grid;grid-template-columns:280px 1fr;gap:18px;min-height:70vh}
    @media(max-width:900px){.ai-layout{grid-template-columns:1fr}}
    .ai-sidebar{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:16px;max-height:80vh;overflow-y:auto}
    .ai-main{background:#fff;border-radius:14px;border:1px solid #e2e8f0;display:flex;flex-direction:column;min-height:520px}
    .agent-item{display:block;width:100%;text-align:right;padding:12px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:8px;background:#f8fafc;cursor:pointer;font-family:inherit}
    .agent-item:hover,.agent-item.active{border-color:#2563eb;background:#eff6ff}
    .agent-item h4{font-size:.95rem;margin-bottom:4px}.agent-item p{font-size:.78rem;color:#64748b;margin:0}
    .chat-header{padding:16px 18px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .chat-body{flex:1;padding:18px;overflow-y:auto;max-height:420px;background:#f8fafc}
    .chat-footer{padding:14px;border-top:1px solid #e2e8f0;display:flex;gap:8px;flex-wrap:wrap}
    .chat-footer textarea{flex:1;min-width:200px;min-height:48px;padding:12px;border-radius:12px;border:1px solid #e2e8f0;font-family:inherit;resize:vertical}
    .msg{margin-bottom:12px;max-width:90%}.msg.user{margin-right:auto}.msg.agent{margin-left:auto}
    .msg-bubble{padding:12px 14px;border-radius:14px;font-size:.92rem;line-height:1.7;white-space:pre-wrap}
    .msg.user .msg-bubble{background:#dbeafe}.msg.agent .msg-bubble{background:#fff;border:1px solid #e2e8f0}
    .msg-meta{font-size:.72rem;color:#94a3b8;margin-top:4px}
    .empty-chat{text-align:center;padding:48px 16px;color:#64748b}
    .quick-prompts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
    .quick-prompts button{font-size:.78rem;padding:6px 10px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-family:inherit}
    .tabs-ai{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span>آ</span> آریاز</a>
      <nav class="nav" id="nav">
        <a href="courses.html">دوره‌ها</a>
        <a href="paths.html">مسیرها</a>
        <a href="agents.html" class="nav-cta">🤖 هوش مصنوعی</a>
        <a href="dashboard.html">داشبورد</a>
      </nav>
      <button class="menu-btn" id="menuBtn" aria-label="منو">☰</button>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <div class="page-header">
        <div>
          <h1>🤖 هوش مصنوعی آریاز</h1>
          <p class="muted">پاسخ ساختاریافته Agentها — نسخه ۳</p>
        </div>
        <span class="badge" id="planBadge">پلن: رایگان</span>
      </div>
      <div class="tabs-ai">
        <button type="button" class="tab active" id="tabChat" onclick="showTab('chat')">گفتگو</button>
        <button type="button" class="tab" id="tabHistory" onclick="showTab('history')">تاریخچه</button>
        <button type="button" class="tab" id="tabOutputs" onclick="showTab('outputs')">خروجی‌ها</button>
      </div>
      <div id="panelChat">
        <div class="ai-layout">
          <aside class="ai-sidebar">
            <h3 style="font-size:.95rem;margin-bottom:12px">Agentها</h3>
            <div id="agentList"></div>
          </aside>
          <section class="ai-main">
            <div class="chat-header">
              <div>
                <strong id="activeAgentTitle">Agent انتخاب نشده</strong>
                <p class="muted" id="activeAgentDesc" style="font-size:.85rem;margin:0">یک Agent از لیست انتخاب کنید</p>
              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button type="button" class="btn btn-secondary btn-sm" onclick="clearCurrentChat()">پاک کردن گفتگو</button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="saveLastOutput()">ذخیره پاسخ</button>
              </div>
            </div>
            <div class="chat-body" id="chatBody">
              <div class="empty-chat"><div style="font-size:2.5rem">🤖</div><p>Agent را انتخاب کنید</p><div class="quick-prompts" id="quickPrompts"></div></div>
            </div>
            <div class="chat-footer">
              <textarea id="chatInput" placeholder="مثلاً: سلام  یا  چارچوب بازخورد عملکرد را بگو" rows="2"></textarea>
              <button type="button" class="btn btn-primary" onclick="sendMessage()">ارسال</button>
            </div>
          </section>
        </div>
      </div>
      <div id="panelHistory" class="hidden"><div class="card" style="padding:20px"><h3>تاریخچه</h3><div id="historyList"></div></div></div>
      <div id="panelOutputs" class="hidden"><div class="card" style="padding:20px"><h3>خروجی‌ها</h3><div id="outputsList"></div></div></div>
    </div>
  </main>
  <footer class="footer"><div class="footer-bottom">© ۱۴۰۵ آریاز</div></footer>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/agents.js?v=3"></script>
</body>
</html>
