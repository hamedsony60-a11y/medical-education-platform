<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>فایل‌های صوتی | مد‌ادو</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span>م</span> مد‌ادو</a>
      <nav class="nav" id="nav">
        <a href="exams.html">آزمون‌ها</a>
        <a href="videos.html">ویدیوها</a>
        <a href="audio.html" class="active">صوت</a>
        <a href="store.html">فروشگاه</a>
        <a href="seminars.html">سمینارها</a>
        <a href="dashboard.html" class="nav-cta">داشبورد</a>
      </nav>
      <button class="menu-btn" id="menuBtn" aria-label="منو">☰</button>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <div class="page-header">
        <div>
          <h1>فایل‌های صوتی آموزشی</h1>
          <p class="muted">پادکست و مرور صوتی تخصصی</p>
        </div>
        <button class="btn btn-primary" onclick="document.getElementById('uploadAudio').click()">آپلود صوت</button>
        <input type="file" id="uploadAudio" accept="audio/*" hidden onchange="handleAudioUpload(this)" />
      </div>
      <div class="list" id="audioList"></div>
    </div>
  </main>
  <div class="audio-player-bar" id="audioBar">
    <span id="nowPlaying">در حال پخش...</span>
    <audio id="audioPlayer" controls></audio>
    <button class="btn btn-sm btn-secondary" onclick="stopAudio()">بستن</button>
  </div>
  <footer class="footer"><div class="footer-bottom">© ۱۴۰۵ مد‌ادو</div></footer>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/audio.js"></script>
