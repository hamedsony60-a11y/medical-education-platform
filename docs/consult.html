<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مشاوره | آریاز</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><img src="assets/logo.svg" alt="" width="36" height="36" /> آریاز</a>
      <nav class="nav" id="nav">
        <a href="courses.html">دوره‌ها</a>
        <a href="consult.html" class="active">مشاوره</a>
        <a href="agents.html" class="nav-cta">هوش مصنوعی</a>
        <a href="dashboard.html">داشبورد</a>
      </nav>
      <button class="menu-btn" id="menuBtn" aria-label="منو">☰</button>
    </div>
  </header>
  <main class="section">
    <div class="container" style="max-width:640px">
      <h1>درخواست مشاوره و رزرو</h1>
      <p class="muted mb-8">مشاوره فردی، جلسه تخصصی یا خدمات سازمانی</p>
      <div class="card" style="padding:24px">
        <div class="form-group"><label>نام</label><input id="fName" /></div>
        <div class="form-group"><label>ایمیل / موبایل</label><input id="fContact" /></div>
        <div class="form-group"><label>نوع درخواست</label>
          <select id="fType">
            <option>مشاوره فردی</option>
            <option>رزرو جلسه با متخصص</option>
            <option>خدمات سازمانی</option>
            <option>دمو پلن سازمانی</option>
          </select>
        </div>
        <div class="form-group"><label>توضیحات</label><textarea id="fMsg" rows="4"></textarea></div>
        <button class="btn btn-primary btn-block" onclick="submitLead()">ارسال درخواست</button>
      </div>
      <h2 class="mt-8">درخواست‌های ثبت‌شده</h2>
      <div class="card"><ul class="activity-list" id="leadList"></ul></div>
    </div>
  </main>
  <footer class="footer"><div class="footer-bottom">© ۱۴۰۵ آریاز</div></footer>
  <script src="assets/js/main.js"></script>
  <script>
    function submitLead() {
      var name = document.getElementById('fName').value.trim();
      var contact = document.getElementById('fContact').value.trim();
      var type = document.getElementById('fType').value;
      if (!name || !contact) { toast('نام و راه ارتباطی را پر کنید'); return; }
      var leads = getStore('aryaz_leads', []) || [];
      leads.unshift({ name: name, contact: contact, type: type, msg: document.getElementById('fMsg').value, status: 'در انتظار بررسی', time: new Date().toLocaleString('fa-IR') });
      setStore('aryaz_leads', leads.slice(0, 30));
      addActivity('درخواست: ' + type);
      toast('درخواست ثبت شد');
      document.getElementById('fName').value = '';
      document.getElementById('fContact').value = '';
      document.getElementById('fMsg').value = '';
      renderLeads();
    }
    function renderLeads() {
      var leads = getStore('aryaz_leads', []) || [];
      var el = document.getElementById('leadList');
      if (!leads.length) { el.innerHTML = '<li class="muted">درخواستی نیست</li>'; return; }
      el.innerHTML = leads.map(function (l) {
        return '<li><span>' + l.type + ' — ' + l.name + ' <span class="badge">' + l.status + '</span></span><span class="time">' + l.time + '</span></li>';
      }).join('');
    }
    document.addEventListener('DOMContentLoaded', renderLeads);
  </script>
</body>
</html>
