<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>داشبورد | آریاز</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><img src="assets/logo.svg" alt="" width="36" height="36" /> آریاز</a>
      <nav class="nav" id="nav">
        <a href="courses.html">دوره‌ها</a>
        <a href="paths.html">مسیرها</a>
        <a href="assessments.html">ارزیابی</a>
        <a href="library.html">کتابخانه</a>
        <a href="store.html">فروشگاه</a>
        <a href="agents.html" class="nav-cta">هوش مصنوعی</a>
        <a href="dashboard.html" class="active">داشبورد</a>
      </nav>
      <button class="menu-btn" id="menuBtn" aria-label="منو">☰</button>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <h1>داشبورد من</h1>
      <p class="muted mb-6">پلن: <strong id="planLabel">رایگان</strong></p>
      <div class="stats-grid">
        <div class="card stat-card"><p class="muted">دوره‌ها</p><p class="stat-num" id="sCourses">۰</p></div>
        <div class="card stat-card"><p class="muted">مسیرها</p><p class="stat-num" id="sPaths">۰</p></div>
        <div class="card stat-card"><p class="muted">ارزیابی‌ها</p><p class="stat-num" id="sAssess">۰</p></div>
        <div class="card stat-card"><p class="muted">سفارش‌ها</p><p class="stat-num" id="sOrders">۰</p></div>
      </div>
      <h2 class="mt-8">دسترسی سریع</h2>
      <div class="grid-4">
        <a href="courses.html" class="card quick-link">🎓 دوره‌ها</a>
        <a href="paths.html" class="card quick-link">🗺️ مسیرها</a>
        <a href="assessments.html" class="card quick-link">📋 ارزیابی</a>
        <a href="agents.html" class="card quick-link">🤖 هوش مصنوعی</a>
        <a href="library.html" class="card quick-link">📚 کتابخانه</a>
        <a href="store.html" class="card quick-link">🛒 فروشگاه</a>
        <a href="membership.html" class="card quick-link">🔐 عضویت</a>
        <a href="consult.html" class="card quick-link">📅 مشاوره</a>
      </div>
      <h2 class="mt-8">فعالیت‌های اخیر</h2>
      <div class="card"><ul class="activity-list" id="actList"><li class="muted">هنوز فعالیتی ثبت نشده</li></ul></div>
    </div>
  </main>
  <footer class="footer"><div class="footer-bottom">© ۱۴۰۵ آریاز</div></footer>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var courses = getStore('aryaz_courses', {}) || {};
      var paths = getStore('aryaz_paths', {}) || {};
      var assess = getStore('aryaz_assess', []) || [];
      var orders = getStore('aryaz_orders', []) || [];
      var act = getStore('med_activity', []) || [];
      document.getElementById('planLabel').textContent = getStore('aryaz_plan', 'رایگان') || 'رایگان';
      document.getElementById('sCourses').textContent = Object.keys(courses).length;
      document.getElementById('sPaths').textContent = Object.keys(paths).length;
      document.getElementById('sAssess').textContent = assess.length;
      document.getElementById('sOrders').textContent = orders.length;
      if (act.length) {
        document.getElementById('actList').innerHTML = act.slice(0, 15).map(function (a) {
          return '<li><span>' + a.text + '</span><span class="time">' + a.time + '</span></li>';
        }).join('');
      }
    });
  </script>
</body>
</html>
