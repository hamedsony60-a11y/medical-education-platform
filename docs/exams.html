<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>آزمون‌های آنلاین | مد‌ادو</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span>م</span> مد‌ادو</a>
      <nav class="nav" id="nav">
        <a href="exams.html" class="active">آزمون‌ها</a>
        <a href="videos.html">ویدیوها</a>
        <a href="audio.html">صوت</a>
        <a href="store.html">فروشگاه</a>
        <a href="seminars.html">سمینارها</a>
        <a href="dashboard.html" class="nav-cta">داشبورد</a>
      </nav>
      <button class="menu-btn" id="menuBtn" aria-label="منو">☰</button>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="page-header">
        <div>
          <h1>آزمون‌های آنلاین</h1>
          <p class="muted">سوالات استاندارد، تایمر و نمره‌دهی خودکار</p>
        </div>
        <button class="btn btn-primary" onclick="openCreateExam()">+ ساخت آزمون</button>
      </div>

      <div class="toolbar">
        <div class="search-box"><input type="search" id="examSearch" placeholder="جستجوی آزمون..." oninput="filterExams()" /></div>
        <select class="filter-select" id="examFilter" onchange="filterExams()">
          <option value="">همه تخصص‌ها</option>
          <option value="فیزیولوژی">فیزیولوژی</option>
          <option value="پاتولوژی">پاتولوژی</option>
          <option value="فارماکولوژی">فارماکولوژی</option>
          <option value="آناتومی">آناتومی</option>
        </select>
      </div>

      <div class="list" id="examList"></div>

      <div id="examBox" class="card exam-box hidden">
        <h2 id="examTitle">آزمون</h2>
        <div class="exam-progress">
          <p id="examTimer" class="muted">زمان باقی‌مانده: ۶۰:۰۰</p>
          <div class="progress-bar"><span id="examProgressBar" style="width:0%"></span></div>
        </div>
        <div id="questionArea"></div>
        <div class="exam-actions">
          <button class="btn btn-secondary" onclick="prevQ()">قبلی</button>
          <button class="btn btn-primary" onclick="nextQ()">بعدی</button>
          <button class="btn btn-green" onclick="submitExam()">ثبت نهایی</button>
        </div>
      </div>
    </div>
  </main>

  <div id="createModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="closeCreateExam()">×</button>
      <h2 style="margin-bottom:16px">ساخت آزمون جدید</h2>
      <div class="form-group"><label>عنوان</label><input id="newTitle" placeholder="مثال: آزمون آناتومی سر و گردن" /></div>
      <div class="form-group"><label>تخصص</label>
        <select id="newSpec"><option>فیزیولوژی</option><option>پاتولوژی</option><option>فارماکولوژی</option><option>آناتومی</option></select>
      </div>
      <div class="form-group"><label>تعداد سوال (نمایشی)</label><input id="newQ" type="number" value="20" min="5" /></div>
      <div class="form-group"><label>مدت (دقیقه)</label><input id="newDur" type="number" value="30" min="5" /></div>
      <button class="btn btn-primary btn-block" onclick="saveNewExam()">ذخیره آزمون</button>
    </div>
  </div>

  <footer class="footer"><div class="footer-bottom">© ۱۴۰۵ مد‌ادو</div></footer>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/exams.js"></script>
</body>
</html>
