<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>کتابخانه دیجیتال | آریاز</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span>آ</span> آریاز</a>
      <nav class="nav" id="nav">
        <a href="courses.html">دوره‌ها</a>
        <a href="paths.html">مسیر یادگیری</a>
        <a href="assessments.html">ارزیابی</a>
        <a href="library.html" class="active">کتابخانه</a>
        <a href="store.html">فروشگاه</a>
        <a href="agents.html">Agent هوشمند</a>
        <a href="dashboard.html" class="nav-cta">داشبورد</a>
      </nav>
      <button class="menu-btn" id="menuBtn" aria-label="منو">☰</button>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <h1>Digital Library</h1>
      <p class="muted mb-8">کتاب تخصصی، خلاصه، مطالعه و علاقه‌مندی</p>
      <div class="grid-3" id="bookGrid"></div>
      <div id="bookModal" class="modal hidden">
        <div class="modal-content">
          <button class="modal-close" onclick="document.getElementById('bookModal').classList.add('hidden')">×</button>
          <h2 id="bTitle"></h2>
          <p class="muted" id="bAuthor"></p>
          <p id="bSummary" style="margin:14px 0;line-height:1.8"></p>
          <div class="progress-bar"><span id="bBar" style="width:0%"></span></div>
          <p class="muted" id="bPct" style="margin:8px 0 14px">۰٪ مطالعه</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn btn-primary" onclick="readMore()">ادامه مطالعه (+۲۵٪)</button>
            <button class="btn btn-secondary" onclick="toggleFav()">علاقه‌مندی</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="footer"><div class="footer-bottom">© ۱۴۰۵ آریاز</div></footer>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/library.js"></script>
</body>
</html>
