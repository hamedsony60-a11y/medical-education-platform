<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>فروشگاه | آریاز</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><img src="assets/logo.svg" alt="" width="36" height="36" /> آریاز</a>
      <nav class="nav" id="nav">
        <a href="courses.html">دوره‌ها</a>
        <a href="store.html" class="active">فروشگاه</a>
        <a href="membership.html">عضویت</a>
        <a href="agents.html" class="nav-cta">هوش مصنوعی</a>
        <a href="dashboard.html">داشبورد</a>
      </nav>
      <button class="menu-btn" id="menuBtn" aria-label="منو">☰</button>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <h1>فروشگاه</h1>
      <p class="muted mb-6">دوره، کتاب، ابزار و Agent — کد تخفیف نمونه: ARIAZ20</p>
      <div class="toolbar">
        <input id="couponInput" placeholder="کد تخفیف" style="padding:11px 14px;border:1px solid #e2e8f0;border-radius:12px;font-family:inherit" />
        <button class="btn btn-secondary" onclick="applyCoupon()">اعمال کد</button>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="all">همه</button>
        <button class="tab" data-tab="course">دوره</button>
        <button class="tab" data-tab="book">کتاب</button>
        <button class="tab" data-tab="tool">ابزار</button>
        <button class="tab" data-tab="agent">Agent</button>
      </div>
      <div class="grid-3" id="storeGrid"></div>
      <div id="lastInvoice"></div>
      <div class="cart-bar" id="cartBar">سبد: <span id="cartCount">۰</span> · <span id="cartTotal">۰</span> تومان
        <button class="btn btn-white btn-sm" onclick="checkout()">پرداخت و فاکتور</button>
      </div>
    </div>
  </main>
  <footer class="footer"><div class="footer-bottom">© ۱۴۰۵ آریاز</div></footer>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/store.js"></script>
</body>
</html>
