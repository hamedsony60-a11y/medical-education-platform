      <h1>ابزارهای کاربردی</h1>
      <p class="muted mb-8">چک‌لیست، Canvas و قالب‌های آماده — قابل ذخیره در مرورگر</p>

      <div class="grid-2" style="margin-bottom:28px">
        <button type="button" class="card feature-card" onclick="openTool('onboard')"><div class="icon icon-green">✅</div><h3>چک‌لیست آنبوردینگ ۳۰ روزه</h3><p>مراحل ورود همکار جدید</p></button>

        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px">
          <h2 id="toolTitle">ابزار</h2>
          <button class="btn btn-secondary btn-sm" onclick="saveTool()">ذخیره</button>
