<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ویدیوهای آموزشی | مد‌ادو</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span>م</span> مد‌ادو</a>
      <nav class="nav" id="nav">
        <a href="exams.html">آزمون‌ها</a>
        <a href="videos.html" class="active">ویدیوها</a>
        <a href="audio.html">صوت</a>
        <a href="store.html">فروشگاه</a>
        <a href="seminars.html">سمینارها</a>
        <a href="dashboard.html" class="nav-cta">داشبورد</a>
      </nav>
      <button class="menu-btn" id="menuBtn" aria-label="منو">☰</button>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <div class="page-header">
        <div>
          <h1>ویدیوهای آموزشی</h1>
          <p class="muted">درس‌گفتار تخصصی با پیگیری پیشرفت</p>
        </div>
        <button class="btn btn-primary" onclick="document.getElementById('uploadVideo').click()">آپلود ویدیو</button>
        <input type="file" id="uploadVideo" accept="video/*" hidden onchange="handleVideoUpload(this)" />
      </div>
      <div class="toolbar">
        <div class="search-box"><input type="search" id="videoSearch" placeholder="جستجوی ویدیو..." oninput="filterVideos()" /></div>
        <select class="filter-select" id="videoFilter" onchange="filterVideos()">
          <option value="">همه دسته‌ها</option>
          <option value="آناتومی">آناتومی</option>
          <option value="کاردیولوژی">کاردیولوژی</option>
          <option value="آزمایشگاه">آزمایشگاه</option>
        </select>
      </div>
      <div class="grid-3" id="videoGrid"></div>
      <div id="playerModal" class="modal hidden">
        <div class="modal-content">
          <button class="modal-close" onclick="closePlayer()">×</button>
          <h3 id="playerTitle">پخش ویدیو</h3>
          <div class="player-placeholder">
            <p id="playerHint">در نسخه کامل پلیر استریم اینجا قرار می‌گیرد.</p>
            <video id="localVideo" controls class="hidden" style="width:100%;border-radius:12px;margin-top:12px"></video>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="footer"><div class="footer-bottom">© ۱۴۰۵ مد‌ادو</div></footer>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/videos.js"></script>
</body>
</html>
